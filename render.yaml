# Render blueprint for the Voyager API (the web app deploys separately, e.g. on Vercel).
#
# Memory (measured locally, see apps/api/README.md): with the embedded Qdrant index the API peaks
# around 0.7 GB, so the 512 MB free/starter instances are too small for that mode. To fit 512 MB:
#   1. create a free Qdrant Cloud cluster, set QDRANT_URL / QDRANT_API_KEY
#   2. copy the index once from a dev machine:  python -m voyager.rag.ingest --copy-to "$QDRANT_URL"
#   3. build with BUILD_INDEX=0 (below) - the in-process index (~210 MB) disappears
#   optional: VOYAGER_RERANK=false saves another ~95 MB (quality trade-off, see docs/eval-results.md)
services:
  - type: web
    name: voyager-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["apps/api/**", "data/corpus.jsonl", "render.yaml"]
    envVars:
      - key: BUILD_INDEX
        value: "0"
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false            # https://<service>.onrender.com (the A2A agent card advertises it)
      - key: VOYAGER_USER_AGENT
        sync: false            # include your repo URL (Wikimedia requires one)
      - key: VOYAGER_EMBED_THREADS
        value: "1"
