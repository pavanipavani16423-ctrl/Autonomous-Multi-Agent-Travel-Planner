[project]
name = "voyager"
version = "2.0.0"
description = "Voyager: a multi-agent travel planner (LangGraph + MCP + A2A + hybrid RAG on Qdrant + Langfuse + Ragas)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.2.3",
    "aiosqlite>=0.21",
    "fastapi>=0.115",
    "fastembed>=0.7",
    "httpx>=0.28",
    "json-repair>=0.44",
    "langchain-core>=1.0",
    "langchain-groq>=1.1",
    "langfuse>=5.2,<6",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "mcp>=2.3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.15",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=2.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Offline evaluation only (heavy): not installed in the production image.
eval = ["ragas>=0.4.3"]
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voyager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
