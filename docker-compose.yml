# Voyager v2 local stack:  docker compose up --build
#   api     FastAPI + LangGraph (embedded Qdrant index baked into the image)   http://localhost:8000
#   budget  the A2A Budget Analyst as its own service (the api calls it over HTTP)   http://localhost:9101
#   web     Next.js workspace (apps/web)                                          http://localhost:3000
#   qdrant  optional Qdrant server:  docker compose --profile qdrant up
#           then set QDRANT_URL=http://qdrant:6333 for the api and copy the index once with
#           docker compose exec api python -m voyager.rag.ingest --copy-to http://qdrant:6333
#
# Secrets come from apps/api/.env (never committed; see apps/api/.env.example).

x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: voyager-api:local

services:
  api:
    <<: *api-image
    env_file: [apps/api/.env]
    environment:
      PORT: "8000"
      PUBLIC_BASE_URL: http://api:8000
      A2A_BUDGET_URL: http://budget:9101
      WEB_ORIGIN: http://localhost:3000
      QDRANT_URL: ${QDRANT_URL:-}
    ports: ["8000:8000"]
    volumes: ["voyager-data:/app/data"]
    depends_on: [budget]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1G }

  budget:
    <<: *api-image
    command: ["python", "-m", "voyager.a2a.budget_server", "--host", "0.0.0.0", "--port", "9101"]
    environment:
      A2A_PUBLIC_URL: http://budget:9101
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      VOYAGER_INGEST_ON_BOOT: "false"
    ports: ["9101:9101"]
    restart: unless-stopped

  web:
    build:
      context: apps/web          # Dockerfile owned by the web app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  qdrant:
    image: qdrant/qdrant:v1.15.5
    profiles: [qdrant]
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

volumes:
  voyager-data:
  qdrant-data:
