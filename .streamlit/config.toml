# Streamlit Community Cloud configuration.
#
# The palette mirrors ui/theme.py so the chrome Streamlit draws (spinners,
# the running indicator, form focus rings) matches the app instead of
# fighting it with the default red.

[theme]
base = "dark"
primaryColor = "#E0A458"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#12161F"
textColor = "#E8EBF0"
font = "sans serif"

[server]
headless = true
# A plan takes 3-5 minutes. The default upload/message limits are fine, but
# keep websocket compression on so a long-lived connection stays cheap.
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
