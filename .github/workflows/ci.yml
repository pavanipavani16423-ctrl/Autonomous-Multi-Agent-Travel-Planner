name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  api:
    name: api (ruff · pytest offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      VOYAGER_OFFLINE: "1" # fake deterministic LLM, mocked tools, in-memory Qdrant: no network, no keys
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    name: web (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
